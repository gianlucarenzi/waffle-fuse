name: Build waffle-fuse

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on Debian 11 (glibc 2.31)
    # GitHub-hosted runner, build inside a Debian 11 container: the binary links
    # against glibc 2.31 and runs on Debian 11 and every newer distribution.
    runs-on: ubuntu-24.04
    container: debian:11

    env:
      DEBIAN_FRONTEND: noninteractive
      # Highest glibc symbol version the binary may require (Debian 11)
      MAX_GLIBC: '2.31'

    steps:
      - name: Install dependencies
        # Debian 11 is end of life: its packages moved to archive.debian.org
        # (the debian-security pool on deb.debian.org answers 404)
        run: |
          find /etc/apt -name '*.list' -o -name '*.sources' | \
            xargs sed -i 's|http://deb.debian.org|http://archive.debian.org|g'
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libfuse3-dev \
            git \
            ca-certificates

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build waffle-fuse
        # Only glibc stays dynamic. libfuse3 is linked statically because its
        # soname changed (libfuse3.so.3 on Debian 11, libfuse3.so.4 from fuse
        # 3.17 on): mounting goes through fusermount3 and /dev/fuse, both stable.
        # libstdc++/libgcc are static too: no dependency on the compiler runtime.
        run: |
          make -j"$(nproc)" \
            FUSE_LIBS="-Wl,-Bstatic -lfuse3 -Wl,-Bdynamic -ldl" \
            EXTRA_LDFLAGS="-static-libstdc++ -static-libgcc"

      - name: Check binary compatibility
        run: |
          echo "--- Shared libraries needed:"
          objdump -p waffle-fuse | grep NEEDED
          if objdump -p waffle-fuse | grep -E 'NEEDED.*(libfuse|libstdc\+\+|libgcc_s)'; then
            echo "::error::libfuse3, libstdc++ and libgcc must be linked statically"
            exit 1
          fi
          NEED=$(objdump -T waffle-fuse | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -1)
          echo "--- Highest glibc version required: $NEED (max allowed: $MAX_GLIBC)"
          if [ "$(printf '%s\n%s\n' "$NEED" "$MAX_GLIBC" | sort -V | tail -1)" != "$MAX_GLIBC" ]; then
            echo "::error::waffle-fuse requires glibc $NEED, newer than $MAX_GLIBC"
            exit 1
          fi
          ./waffle-fuse --help | head -3

      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: waffle-fuse-linux-x86_64
          path: waffle-fuse
          if-no-files-found: error

  build-modplayer-linux:
    name: Waffle ModPlayer for Linux (Qt 6.8 bundled)
    # Debian 11 container, as waffle-fuse: the player and the official Qt 6.8
    # binaries (built for glibc 2.28) run on Debian 11 and every newer system.
    runs-on: ubuntu-24.04
    container: debian:11

    env:
      DEBIAN_FRONTEND: noninteractive
      QT_VERSION: '6.8.3'
      MAX_GLIBC: '2.31'

    steps:
      - name: Install dependencies
        run: |
          find /etc/apt -name '*.list' -o -name '*.sources' | \
            xargs sed -i 's|http://deb.debian.org|http://archive.debian.org|g'
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config curl ca-certificates git patchelf \
            python3 python3-pip python3-venv \
            libasound2-dev libpulse-dev \
            libgl-dev libegl-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-dev \
            libglib2.0-0 libdbus-1-3 libx11-xcb1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Qt ${{ env.QT_VERSION }}
        run: |
          python3 -m venv /opt/aqt
          /opt/aqt/bin/pip install -q aqtinstall
          /opt/aqt/bin/aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O /opt/Qt \
            --archives qtbase qtwayland icu
          echo "QT_DIR=/opt/Qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"

      - name: Build libmikmod (static)
        run: sh modplayer/build-libmikmod.sh /opt/mikmod

      - name: Build Waffle ModPlayer
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) VERSION="${GITHUB_REF_NAME#v}" ;;
            *) VERSION="0.0.0.dev${GITHUB_RUN_NUMBER}" ;;
          esac
          cmake -S modplayer -B build-modplayer \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_DIR" \
            -DMIKMOD_ROOT=/opt/mikmod -DMODPLAYER_BUNDLE=ON -DWAFFLE_VERSION="$VERSION"
          cmake --build build-modplayer --parallel
          strip build-modplayer/waffle-modplayer

      - name: Bundle Qt
        run: |
          sh modplayer/bundle-linux.sh build-modplayer/waffle-modplayer "$QT_DIR" modplayer-bundle
          NEED=$(find modplayer-bundle -type f \( -name '*.so*' -o -name waffle-modplayer \) -exec objdump -T {} + 2>/dev/null |
                 grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -1)
          echo "--- Highest glibc version required: $NEED (max allowed: $MAX_GLIBC)"
          if [ "$(printf '%s\n%s\n' "$NEED" "$MAX_GLIBC" | sort -V | tail -1)" != "$MAX_GLIBC" ]; then
            echo "::error::the ModPlayer bundle requires glibc $NEED"
            exit 1
          fi
          if ldd modplayer-bundle/waffle-modplayer | grep 'not found'; then exit 1; fi
          modplayer-bundle/waffle-modplayer --version
          tar -C modplayer-bundle -cf modplayer-bundle.tar .

      - name: Upload bundle
        uses: actions/upload-artifact@v6
        with:
          name: waffle-modplayer-linux-x86_64
          path: modplayer-bundle.tar
          if-no-files-found: error

  test-modplayer-linux:
    name: Test Waffle ModPlayer on Linux (waffle-fuse disks)
    needs: [build, build-modplayer-linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install FUSE and the desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fuse3 xdg-utils desktop-file-utils xvfb \
            libgl1 libegl1 libfontconfig1 libglib2.0-0 libdbus-1-3 libx11-xcb1 fonts-dejavu-core
          sudo chmod 666 /dev/fuse

      - name: Download waffle-fuse
        uses: actions/download-artifact@v7
        with:
          name: waffle-fuse-linux-x86_64

      - name: Download the ModPlayer bundle
        uses: actions/download-artifact@v7
        with:
          name: waffle-modplayer-linux-x86_64

      - name: Test (as installed by the packages)
        run: |
          chmod +x waffle-fuse
          mkdir modplayer-bundle && tar -C modplayer-bundle -xf modplayer-bundle.tar
          # The packaged layout: waffle-modplayer launcher, the bundle in modplayer/
          sh packaging/stage.sh waffle-fuse stage modplayer-bundle
          cp -R stage/modplayer stage/waffle-modplayer .
          SHOT_DIR="$RUNNER_TEMP/shots" bash tests/test-modplayer.sh
          # On a real X server too (the tests use the offscreen platform)
          python3 docs/examples/make-mod.py "$RUNNER_TEMP/waffle.mod"
          QT_QPA_PLATFORM=xcb xvfb-run -a ./waffle-modplayer --mute --force --quit-after 4 "$RUNNER_TEMP/waffle.mod"
          echo "X11: OK"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: modplayer-screenshots-linux
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: ignore

  package:
    name: Packages (deb, rpm, Arch, generic)
    needs: [build, build-modplayer-linux]
    runs-on: ubuntu-24.04

    env:
      NFPM_VERSION: '2.47.0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download binary
        uses: actions/download-artifact@v7
        with:
          name: waffle-fuse-linux-x86_64
          path: bin

      - name: Download the ModPlayer bundle
        uses: actions/download-artifact@v7
        with:
          name: waffle-modplayer-linux-x86_64
          path: bin

      - name: Package version
        # Release tag vX.Y.Z -> X.Y.Z; manual runs -> 0.0.0.dev<run number>
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) VERSION="${GITHUB_REF_NAME#v}" ;;
            *) VERSION="0.0.0.dev${GITHUB_RUN_NUMBER}" ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Package version: $VERSION"

      - name: Install nFPM
        run: |
          cd "$RUNNER_TEMP"
          TARBALL="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -sSLO "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/$TARBALL"
          curl -sSLO "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/checksums.txt"
          grep " $TARBALL\$" checksums.txt | sha256sum -c -
          tar xzf "$TARBALL" nfpm
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build packages
        run: |
          chmod +x bin/waffle-fuse      # artifacts lose the executable bit
          mkdir bin/modplayer && tar -C bin/modplayer -xf bin/modplayer-bundle.tar
          sh packaging/stage.sh bin/waffle-fuse stage/waffle-fuse bin/modplayer
          mkdir -p dist
          for p in deb rpm archlinux; do
            nfpm package -f packaging/nfpm.yaml -p "$p" -t dist/
          done
          # Generic archive for the other distributions: install.sh copies to /opt
          GENERIC="waffle-fuse-${VERSION}-linux-x86_64"
          mkdir -p "generic/$GENERIC"
          cp -R stage/waffle-fuse "generic/$GENERIC/"
          install -m 755 packaging/install.sh "generic/$GENERIC/"
          install -m 644 packaging/waffle-installer.desktop "generic/$GENERIC/"
          tar -C generic --owner=0 --group=0 -czf "dist/$GENERIC.tar.gz" "$GENERIC"
          ls -l dist

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: waffle-fuse-packages
          path: dist/*
          if-no-files-found: error

  test-install:
    name: Install on ${{ matrix.name }}
    needs: package
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 11
            image: debian:11
            # end of life: packages on archive.debian.org
            install: |
              find /etc/apt -name '*.list' -o -name '*.sources' | xargs sed -i 's|http://deb.debian.org|http://archive.debian.org|g'
              apt-get -o Acquire::Check-Valid-Until=false update
              apt-get install -y ./pkgs/*.deb
            remove: apt-get remove -y waffle-fuse
            # What every desktop has, and the bundled Qt of Waffle ModPlayer uses
            desktop: apt-get install -y --no-install-recommends libgl1 libegl1 libfontconfig1 libxkbcommon0 libglib2.0-0 libdbus-1-3 libx11-6 libx11-xcb1 libxcb1 libwayland-client0 libwayland-cursor0 libwayland-egl1
          - name: Debian 13
            image: debian:13
            install: apt-get update && apt-get install -y ./pkgs/*.deb
            remove: apt-get remove -y waffle-fuse
            desktop: apt-get install -y --no-install-recommends libgl1 libegl1 libfontconfig1 libxkbcommon0 libglib2.0-0 libdbus-1-3 libx11-6 libx11-xcb1 libxcb1 libwayland-client0 libwayland-cursor0 libwayland-egl1
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            install: apt-get update && apt-get install -y ./pkgs/*.deb
            remove: apt-get remove -y waffle-fuse
            desktop: apt-get install -y --no-install-recommends libgl1 libegl1 libfontconfig1 libxkbcommon0 libglib2.0-0 libdbus-1-3 libx11-6 libx11-xcb1 libxcb1 libwayland-client0 libwayland-cursor0 libwayland-egl1
          - name: Fedora
            image: fedora:latest
            install: dnf install -y ./pkgs/*.rpm
            remove: dnf remove -y waffle-fuse
            desktop: dnf install -y mesa-libGL mesa-libEGL fontconfig libxkbcommon glib2 dbus-libs libX11 libX11-xcb libxcb libwayland-client libwayland-cursor libwayland-egl
          - name: openSUSE Tumbleweed
            image: opensuse/tumbleweed
            install: zypper --non-interactive install --allow-unsigned-rpm ./pkgs/*.rpm
            remove: zypper --non-interactive remove waffle-fuse
            desktop: zypper --non-interactive install Mesa-libGL1 Mesa-libEGL1 fontconfig libxkbcommon0 libglib-2_0-0 libgthread-2_0-0 libdbus-1-3 libX11-6 libX11-xcb1 libxcb1 libwayland-client0 libwayland-cursor0 libwayland-egl1
          - name: Arch Linux
            image: archlinux:latest
            install: pacman -Syu --noconfirm && pacman -U --noconfirm ./pkgs/*.pkg.tar.zst
            remove: pacman -R --noconfirm waffle-fuse
            desktop: pacman -S --noconfirm libglvnd fontconfig libxkbcommon glib2 dbus libx11 libxcb wayland
          - name: generic archive (Debian 13)
            image: debian:13
            install: |
              apt-get update && apt-get install -y python3 python3-gi gir1.2-gtk-3.0 fuse3 acl
              mkdir generic && tar -C generic -xzf pkgs/*.tar.gz
              sh generic/*/install.sh
              rm -rf generic
            remove: sh /opt/waffle-fuse/install.sh --uninstall
            desktop: apt-get install -y --no-install-recommends libgl1 libegl1 libfontconfig1 libxkbcommon0 libglib2.0-0 libdbus-1-3 libx11-6 libx11-xcb1 libxcb1 libwayland-client0 libwayland-cursor0 libwayland-egl1

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          name: waffle-fuse-packages
          path: pkgs

      - name: Install
        run: ${{ matrix.install }}

      - name: Check installation
        run: |
          waffle-fuse --help | head -3
          test -x /opt/waffle-fuse/scripts/waffle-installer.py
          command -v waffle-installer
          python3 -c "import gi; gi.require_version('Gtk', '3.0')"
          command -v fusermount3

      - name: Checkout code (demo module)
        uses: actions/checkout@v5
        with:
          path: src

      - name: Check Waffle ModPlayer (its own Qt, no Qt on the system)
        run: |
          ${{ matrix.desktop }}
          /opt/waffle-fuse/waffle-modplayer --version
          # The player and its X11 and Wayland plugins: everything but the basic
          # desktop libraries above comes with it
          for f in /opt/waffle-fuse/modplayer/waffle-modplayer /opt/waffle-fuse/modplayer/plugins/platforms/*.so; do
            if ldd "$f" | grep 'not found'; then echo "::error::$f: libraries missing"; exit 1; fi
          done
          python3 src/docs/examples/make-mod.py /tmp/waffle.mod
          QT_QPA_PLATFORM=offscreen /opt/waffle-fuse/waffle-modplayer --mute --force --quit-after 3 /tmp/waffle.mod

      - name: Remove
        run: ${{ matrix.remove }}

      - name: Check removal
        run: |
          if [ -e /opt/waffle-fuse ] || command -v waffle-fuse; then
            echo "::error::waffle-fuse still installed"
            exit 1
          fi

  build-macos:
    name: Build on macOS (universal, FUSE-T)
    runs-on: macos-15
    timeout-minutes: 30

    env:
      FUSE_T_VERSION: '1.2.9'
      FUSE_T_SHA256: a1b893740ded8ea034f1acc522ded1144f4a567a1f416daef8c1441cf2662f7f
      # FUSE-T's libfuse3 needs macOS 12
      MACOS_MIN: '12.0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install FUSE-T and test tools
        run: |
          PKG="$RUNNER_TEMP/fuse-t.pkg"
          curl -sSL -o "$PKG" "https://github.com/macos-fuse-t/fuse-t/releases/download/${FUSE_T_VERSION}/fuse-t-macos-installer-${FUSE_T_VERSION}.pkg"
          echo "$FUSE_T_SHA256  $PKG" | shasum -a 256 -c -
          sudo installer -pkg "$PKG" -target /
          ls -l /usr/local/lib/libfuse3* /usr/local/include/fuse3/fuse.h
          brew install coreutils dosfstools librsvg
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q amitools pyfatfs "setuptools<81" || echo "::warning::amitools/pyfatfs not installed: independent checks skipped"

      - name: Build universal binary
        # One architecture at a time, then lipo: dependency files (-MMD) do not
        # work with several -arch flags in one compiler run
        run: |
          for arch in arm64 x86_64; do
            FLAGS="-arch $arch -mmacosx-version-min=$MACOS_MIN"
            make clean
            make -j"$(sysctl -n hw.ncpu)" EXTRA_CXXFLAGS="$FLAGS" EXTRA_LDFLAGS="$FLAGS"
            mv waffle-fuse "waffle-fuse-$arch"
          done
          lipo -create -output waffle-fuse waffle-fuse-arm64 waffle-fuse-x86_64
          rm waffle-fuse-arm64 waffle-fuse-x86_64

      - name: Check binary
        run: |
          lipo -info waffle-fuse
          lipo -info waffle-fuse | grep -q 'x86_64 arm64'
          echo "--- Libraries:"
          otool -L waffle-fuse
          echo "--- Minimum macOS:"
          vtool -show-build waffle-fuse | grep minos
          ./waffle-fuse --help | head -3

      - name: Filesystem tests (disk images through FUSE-T)
        timeout-minutes: 15
        run: |
          export PATH="$(brew --prefix coreutils)/libexec/gnubin:$(brew --prefix dosfstools)/sbin:$RUNNER_TEMP/venv/bin:$PATH"
          export TEST_PYTHON="$RUNNER_TEMP/venv/bin/python"
          tests/run-tests.sh

      - name: Package version
        # Release tag vX.Y.Z -> X.Y.Z; manual runs -> 0.0.0.dev<run number>
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) VERSION="${GITHUB_REF_NAME#v}" ;;
            *) VERSION="0.0.0.dev${GITHUB_RUN_NUMBER}" ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build the menu bar app
        run: macos/build-app.sh "$VERSION" dist

      - name: Build Waffle ModPlayer (Qt 6.8, universal)
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install -q aqtinstall
          "$RUNNER_TEMP/aqt/bin/aqt" install-qt mac desktop 6.8.3 clang_64 -O "$RUNNER_TEMP/Qt" --archives qtbase
          sh modplayer/build-libmikmod.sh "$RUNNER_TEMP/mikmod" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_MIN"
          macos/build-modplayer-app.sh "$VERSION" "$RUNNER_TEMP/Qt/6.8.3/macos" "$RUNNER_TEMP/mikmod" dist
          lipo -info "dist/Waffle ModPlayer.app/Contents/MacOS/Waffle ModPlayer" | grep -q 'x86_64 arm64'
          otool -L "dist/Waffle ModPlayer.app/Contents/MacOS/Waffle ModPlayer"

      - name: Test Waffle ModPlayer (modules on waffle-fuse disks)
        timeout-minutes: 5
        run: SHOT_DIR="$RUNNER_TEMP/shots" bash tests/test-modplayer.sh "$PWD/dist/Waffle ModPlayer.app/Contents/MacOS/Waffle ModPlayer"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: modplayer-screenshots-macos
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: ignore

      - name: Test the app (open an image, write to it, quit)
        timeout-minutes: 8
        run: |
          APP="$PWD/dist/Waffle DiskFlashback.app"
          W=$(mktemp -d /tmp/apptest.XXXXXX)
          is_mounted() { [ -d "$1" ] && [ "$(/usr/bin/stat -f %d "$1")" != "$(/usr/bin/stat -f %d "$1/..")" ]; }
          show() {
            echo "--- app log"; grep -v -E '^\S+ \S+   \[--image\] ( |unique|INIT|flags|max_|congestion|time_gran|getattr|statfs|LOOKUP|lookup)' "$HOME/Library/Logs/WaffleDiskFlashback.log" 2>/dev/null | head -80
            echo "--- FUSE-T log"; tail -12 "$HOME/Library/Logs/fuse-t/fuse-t.log" 2>/dev/null
            echo "--- extended attributes of the mount dirs"
            for d in "$base" "$base/AppTest" "$HOME/Floppy"; do [ -e "$d" ] && { ls -lde@ "$d"; xattr -l "$d"; }; done
            echo "--- how fuse-t resolves"; grep -i fuse /etc/hosts || echo "(not in /etc/hosts)"
            echo "--- local network privacy (system log)"
            log show --last 1m --style compact \
              --predicate 'eventMessage CONTAINS[c] "local network" OR eventMessage CONTAINS[c] "prohibit" OR eventMessage CONTAINS[c] "WaffleDiskFlashback" OR eventMessage CONTAINS[c] "waffle-diskflashback"' \
              2>/dev/null | grep -v "log run noninteractively" | tail -30
          }
          # One run of the app: $1 = mount dir ("" = default ~/Floppy); 0 if all went well
          app_run() {
            local dir="$1" base mnt
            base="${dir:-$HOME/Floppy}"; mnt="$base/AppTest"
            ./waffle-fuse --format-image "$W/t.adf" ffs dd AppTest
            # The app mounts the image as a virtual disk.  Started from the shell:
            # on the runners, an NFS mount from a process of the GUI session fails
            # (FUSE-T: mount exit 66), while apps using FUSE-T work on real Macs
            if [ -n "$dir" ]; then export WAFFLE_MOUNT_DIR="$dir"; else unset WAFFLE_MOUNT_DIR; fi
            WAFFLE_DEBUG=1 "$APP/Contents/MacOS/WaffleDiskFlashback" "$W/t.adf" >/dev/null 2>&1 &
            for _ in $(seq 60); do is_mounted "$mnt" && break; sleep 0.5; done
            if ! is_mounted "$mnt"; then
              echo "::warning::the app did not mount the image in $base"; show
              pkill -KILL -x WaffleDiskFlashback; sleep 1; return 1
            fi
            echo "written through the app" > "$mnt/hello.txt"
            # Quit (SIGTERM, like Quit in the menu): unmount cleanly, then exit
            pkill -TERM -x WaffleDiskFlashback
            for _ in $(seq 120); do pgrep -x WaffleDiskFlashback >/dev/null || break; sleep 0.5; done
            if pgrep -x WaffleDiskFlashback >/dev/null; then echo "::warning::the app did not quit"; show; return 1; fi
            if is_mounted "$mnt"; then echo "::warning::still mounted after quitting"; show; return 1; fi
            # The file reached the image
            mkdir -p "$W/check"
            ./waffle-fuse --image "$W/t.adf" "$W/check" -f & P=$!
            for _ in $(seq 60); do is_mounted "$W/check" && break; sleep 0.5; done
            grep -q "written through the app" "$W/check/hello.txt"; local ok=$?
            umount "$W/check"; wait $P
            [ $ok -eq 0 ] && echo "app run in $base: OK" || { echo "::warning::file not in the image"; return 1; }
          }
          # The app starts through LaunchServices and stays up
          open -a "$APP"
          sleep 5
          pgrep -x WaffleDiskFlashback || { echo "::error::the app did not start"; show; exit 1; }
          pkill -TERM -x WaffleDiskFlashback
          for _ in $(seq 40); do pgrep -x WaffleDiskFlashback >/dev/null || break; sleep 0.25; done
          set +e
          app_run "$W/mnt"; A=$?
          app_run ""; B=$?
          echo "mount dir outside home: $A, ~/Floppy: $B"
          [ $A -eq 0 ] && [ $B -eq 0 ]

      - name: Package
        run: |
          NAME="waffle-fuse-${VERSION}-macos-universal"
          mkdir -p "dist/$NAME"
          install -m 755 waffle-fuse scripts/waffle-mount.sh "packaging/macos/Waffle Floppy.command" "dist/$NAME/"
          install -m 644 packaging/macos/README.txt LICENSE "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          macos/make-dmg.sh "dist/Waffle DiskFlashback.app" "dist/Waffle-DiskFlashback-${VERSION}.dmg" \
            "dist/Waffle ModPlayer.app"
          # The disk image opens and holds the apps
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "dist/Waffle-DiskFlashback-${VERSION}.dmg"
          ls -l "$RUNNER_TEMP/dmg"
          codesign --verify --strict "$RUNNER_TEMP/dmg/Waffle DiskFlashback.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/dmg/Waffle ModPlayer.app"
          hdiutil detach "$RUNNER_TEMP/dmg"
          ls -l dist

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: waffle-fuse-packages-macos
          path: |
            dist/*.tar.gz
            dist/*.dmg
          if-no-files-found: error

  test-macos-intel:
    name: Test on macOS Intel (the x86_64 half of the universal apps)
    needs: build-macos
    runs-on: macos-15-intel
    timeout-minutes: 20

    env:
      FUSE_T_VERSION: '1.2.9'
      FUSE_T_SHA256: a1b893740ded8ea034f1acc522ded1144f4a567a1f416daef8c1441cf2662f7f

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install FUSE-T
        run: |
          PKG="$RUNNER_TEMP/fuse-t.pkg"
          curl -sSL -o "$PKG" "https://github.com/macos-fuse-t/fuse-t/releases/download/${FUSE_T_VERSION}/fuse-t-macos-installer-${FUSE_T_VERSION}.pkg"
          echo "$FUSE_T_SHA256  $PKG" | shasum -a 256 -c -
          sudo installer -pkg "$PKG" -target /

      - name: Download the disk image
        uses: actions/download-artifact@v7
        with:
          name: waffle-fuse-packages-macos
          path: dist

      - name: Test the apps of the disk image
        run: |
          uname -m
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dist/*.dmg
          cp -R "$RUNNER_TEMP/dmg/Waffle DiskFlashback.app" "$RUNNER_TEMP/dmg/Waffle ModPlayer.app" "$RUNNER_TEMP/"
          hdiutil detach "$RUNNER_TEMP/dmg"
          # waffle-fuse from inside the menu bar app, as installed
          cp "$RUNNER_TEMP/Waffle DiskFlashback.app/Contents/MacOS/waffle-fuse" .
          ./waffle-fuse --help | head -2
          SHOT_DIR="$RUNNER_TEMP/shots" bash tests/test-modplayer.sh "$RUNNER_TEMP/Waffle ModPlayer.app/Contents/MacOS/Waffle ModPlayer"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: modplayer-screenshots-macos-intel
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: ignore

  build-windows:
    name: Build on Windows (MinGW-w64, WinFsp)
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      WINFSP_VERSION: '2.1'
      WINFSP_MSI: winfsp-2.1.25156.msi
      WINFSP_SHA256: 073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install WinFsp (with the developer files)
        shell: pwsh
        run: |
          $msi = "$env:RUNNER_TEMP\$env:WINFSP_MSI"
          Invoke-WebRequest -Uri "https://github.com/winfsp/winfsp/releases/download/v$env:WINFSP_VERSION/$env:WINFSP_MSI" -OutFile $msi
          if ((Get-FileHash $msi -Algorithm SHA256).Hash -ne $env:WINFSP_SHA256) { throw "WinFsp: checksum mismatch" }
          Start-Process msiexec.exe -ArgumentList '/i', $msi, '/qn', 'INSTALLLEVEL=1000' -Wait
          Get-ChildItem "${env:ProgramFiles(x86)}\WinFsp\inc\fuse3", "${env:ProgramFiles(x86)}\WinFsp\bin\winfsp-x64.dll"

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            diffutils
            dosfstools
            python
            mingw-w64-ucrt-x86_64-gcc

      - name: Build waffle-fuse.exe and WaffleDiskFlashback.exe
        run: |
          make -j"$(nproc)"
          strip waffle-fuse.exe WaffleDiskFlashback.exe

      - name: Check binary
        # Only Windows system DLLs: no MinGW runtime, and WinFsp loaded at run time
        run: |
          for exe in waffle-fuse.exe WaffleDiskFlashback.exe; do
            echo "--- DLLs needed by $exe:"
            objdump -p $exe | grep 'DLL Name'
            if objdump -p $exe | grep -iE 'DLL Name: (libstdc|libgcc|libwinpthread|winfsp)'; then
              echo "::error::$exe must not need the MinGW runtime or link WinFsp"
              exit 1
            fi
          done
          ./waffle-fuse.exe --help 2>&1 | head -3

      - name: Filesystem tests (disk images through WinFsp)
        timeout-minutes: 15
        run: |
          VENV="$(cygpath -u "$RUNNER_TEMP")/venv"
          python -m venv "$VENV"
          "$VENV/bin/pip" install -q pyfatfs || echo "::warning::pyfatfs not installed: independent FAT checks skipped"
          "$VENV/bin/pip" install -q amitools "setuptools<81" || echo "::warning::amitools not installed: independent AmigaDOS checks skipped"
          export PATH="$PATH:$VENV/bin"
          export TEST_PYTHON="$VENV/bin/python"
          tests/run-tests.sh

      - name: Test the tray app (open an image, write to it, quit)
        timeout-minutes: 5
        run: |
          W="$(mktemp -d)"
          LOG="$(cygpath -u "$LOCALAPPDATA")/Waffle/WaffleDiskFlashback.log"
          is_mounted() { [ -d "$1" ]; }
          show() { echo "--- app log"; cat "$LOG" 2>/dev/null; }
          ./waffle-fuse.exe --format-image "$W/t.adf" ffs dd AppTest
          # Images are mounted under WAFFLE_MOUNT_DIR\<volume name> instead of a drive letter
          export WAFFLE_MOUNT_DIR="$(cygpath -w "$W/mnt")"
          ./WaffleDiskFlashback.exe "$(cygpath -w "$W/t.adf")" &
          APP=$!
          for _ in $(seq 60); do is_mounted "$W/mnt/AppTest" && break; sleep 0.5; done
          is_mounted "$W/mnt/AppTest" || { echo "::error::the app did not mount the image"; show; exit 1; }
          echo "written through the app" > "$W/mnt/AppTest/hello.txt"
          # A second instance with --quit: the running app unmounts cleanly, then exits
          ./WaffleDiskFlashback.exe --quit
          for _ in $(seq 120); do kill -0 $APP 2>/dev/null || break; sleep 0.5; done
          if kill -0 $APP 2>/dev/null; then echo "::error::the app did not quit"; show; exit 1; fi
          if is_mounted "$W/mnt/AppTest"; then echo "::error::still mounted after quitting"; show; exit 1; fi
          # The file reached the image
          ./waffle-fuse.exe --image "$W/t.adf" "$W/check" -f & P=$!
          for _ in $(seq 60); do is_mounted "$W/check" && break; sleep 0.5; done
          grep -q "written through the app" "$W/check/hello.txt"; ok=$?
          ./waffle-fuse.exe --unmount "$W/check"; wait $P
          show
          [ $ok -eq 0 ] && echo "tray app: OK" || { echo "::error::file not in the image"; exit 1; }

      - name: Package version
        # Release tag vX.Y.Z -> X.Y.Z; manual runs -> 0.0.0.dev<run number>
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) VERSION="${GITHUB_REF_NAME#v}" ;;
            *) VERSION="0.0.0.dev${GITHUB_RUN_NUMBER}" ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build Waffle ModPlayer (Qt 6.8, MinGW)
        # The official Qt 6.8 for MinGW with its own compiler (MinGW 13.1);
        # windeployqt puts the Qt DLLs, plugins and MinGW runtime in dist-modplayer\
        # (not "ModPlayer": the file system ignores case, that is the source folder)
        shell: bash
        run: |
          T="$(cygpath -u "$RUNNER_TEMP")"
          python -m venv "$T/aqt"
          AQT="$T/aqt/Scripts/aqt"
          "$T/aqt/Scripts/pip" install -q aqtinstall
          "$AQT" install-qt windows desktop 6.8.3 win64_mingw -O "$T/Qt" --archives qtbase
          "$AQT" install-tool windows desktop tools_mingw1310 qt.tools.win64_mingw1310 -O "$T/Qt"
          "$AQT" install-tool windows desktop tools_ninja qt.tools.ninja -O "$T/Qt"
          export PATH="$T/Qt/Tools/mingw1310_64/bin:$T/Qt/Tools/Ninja:$PATH"
          GEN="-G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++"
          sh modplayer/build-libmikmod.sh "$T/mikmod" $GEN
          cmake -S modplayer -B build-modplayer $GEN -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(cygpath -m "$T/Qt/6.8.3/mingw_64")" \
            -DMIKMOD_ROOT="$(cygpath -m "$T/mikmod")" -DWAFFLE_VERSION="$VERSION"
          cmake --build build-modplayer --parallel
          mkdir -p dist-modplayer
          cp build-modplayer/waffle-modplayer.exe modplayer/THIRD-PARTY-NOTICES.txt dist-modplayer/
          strip dist-modplayer/waffle-modplayer.exe
          "$T/Qt/6.8.3/mingw_64/bin/windeployqt.exe" --release --no-translations \
            --no-system-d3d-compiler --no-opengl-sw --compiler-runtime dist-modplayer/waffle-modplayer.exe
          find dist-modplayer -type f | sort
          du -sh dist-modplayer

      - name: Test Waffle ModPlayer (modules on waffle-fuse disks)
        timeout-minutes: 5
        run: SHOT_DIR="$(cygpath -u "$RUNNER_TEMP")/shots" bash tests/test-modplayer.sh "$PWD/dist-modplayer/waffle-modplayer.exe"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: modplayer-screenshots-windows
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: ignore

      - name: Package
        shell: pwsh
        run: |
          $name = "waffle-fuse-$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory -Force "dist\$name" | Out-Null
          Copy-Item WaffleDiskFlashback.exe, waffle-fuse.exe, LICENSE, packaging\windows\README.txt "dist\$name\"
          Copy-Item -Recurse dist-modplayer "dist\$name\ModPlayer"
          Compress-Archive -Path "dist\$name" -DestinationPath "dist\$name.zip"
          Get-ChildItem dist

      - name: Install Inno Setup 7 (64-bit)
        shell: pwsh
        env:
          INNO_VERSION: '7.1.0'
          INNO_TAG: is-7_1_0
          INNO_SHA256: 0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f
        run: |
          $exe = "$env:RUNNER_TEMP\innosetup-$env:INNO_VERSION-x64.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/$env:INNO_TAG/innosetup-$env:INNO_VERSION-x64.exe" -OutFile $exe
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne $env:INNO_SHA256) { throw "Inno Setup: checksum mismatch" }
          $dir = "$env:ProgramFiles\Inno Setup 7"
          $p = Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/ALLUSERS', "/DIR=`"$dir`"", "/LOG=`"$env:RUNNER_TEMP\inno.log`"" -Wait -PassThru
          if (-not (Test-Path "$dir\ISCC.exe")) {
            Write-Host "exit code $($p.ExitCode)"; Get-Content "$env:RUNNER_TEMP\inno.log" -Tail 30
            Get-ChildItem "$env:ProgramFiles", "${env:ProgramFiles(x86)}", "$env:LOCALAPPDATA\Programs" -Filter ISCC.exe -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object FullName
            throw "ISCC.exe not in $dir"
          }

      - name: Build the installer
        run: windows/make-installer.sh "$VERSION"

      - name: Test the installer (silent install, run, uninstall)
        # WinFsp is already installed here, so its task is skipped; then the
        # program must be in Program Files and on the system PATH, and gone after
        # the uninstall
        shell: pwsh
        run: |
          $setup = "dist\waffle-fuse-setup-$env:VERSION.exe"
          $app = "$env:ProgramFiles\waffle-fuse"
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=addtopath,associate', "/LOG=$env:RUNNER_TEMP\setup.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log"; throw "setup failed: $($p.ExitCode)" }
          & "$app\waffle-fuse.exe" --help 2>&1 | Select-Object -First 3
          if (-not (Test-Path "$app\WaffleDiskFlashback.exe")) { throw "WaffleDiskFlashback.exe not installed" }
          if ((Get-ItemProperty 'Registry::HKEY_CLASSES_ROOT\Waffle.FloppyImage\shell\open\command').'(default)' -notlike '*WaffleDiskFlashback.exe*') { throw "image association missing" }
          # Waffle ModPlayer with its Qt, registered for .mod files, and it runs
          if (-not (Test-Path "$app\ModPlayer\waffle-modplayer.exe")) { throw "Waffle ModPlayer not installed" }
          if (-not (Test-Path "$app\ModPlayer\platforms\qwindows.dll")) { throw "the Qt platform plugin is missing" }
          if ((Get-ItemProperty 'Registry::HKEY_CLASSES_ROOT\Waffle.Module\shell\open\command').'(default)' -notlike '*waffle-modplayer.exe*') { throw "module association missing" }
          python docs/examples/make-mod.py "$env:RUNNER_TEMP\waffle.mod"
          $p = Start-Process "$app\ModPlayer\waffle-modplayer.exe" -ArgumentList '--mute', '--force', '--quit-after', '3', "$env:RUNNER_TEMP\waffle.mod" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Waffle ModPlayer failed: $($p.ExitCode)" }
          $path = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          if (-not ($path.Split(';') -contains $app)) { throw "not added to the PATH: $path" }
          $p = Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }
          # The uninstaller finishes in a copy of itself: wait for it
          function OnPath { [Environment]::GetEnvironmentVariable('Path', 'Machine').Split(';') -contains $app }
          for ($i = 0; $i -lt 30 -and ((Test-Path "$app\waffle-fuse.exe") -or (OnPath)); $i++) { Start-Sleep 1 }
          if (Test-Path "$app\waffle-fuse.exe") { throw "still installed after the uninstall" }
          if (Test-Path "$app\ModPlayer") { throw "Waffle ModPlayer still installed after the uninstall" }
          if (OnPath) { throw "still on the PATH after the uninstall" }
          # A 64-bit installer (PE32+, machine AMD64)
          $b = [IO.File]::ReadAllBytes($setup); $pe = [BitConverter]::ToInt32($b, 0x3C)
          if ([BitConverter]::ToUInt16($b, $pe + 4) -ne 0x8664) { throw "the installer is not a 64-bit program" }
          Write-Host "installer: OK"

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: waffle-fuse-packages-windows
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, test-install, test-modplayer-linux, build-macos, test-macos-intel, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          pattern: waffle-fuse-packages*
          merge-multiple: true
          path: pkgs

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: pkgs/*
          generate_release_notes: true
