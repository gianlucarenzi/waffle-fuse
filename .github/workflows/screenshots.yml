name: Screenshots

# Screenshots of the documentation (docs/images/screenshots), taken on real
# Linux, macOS and Windows desktops of the GitHub runners with the demo images
# of docs/examples.  Run from the Actions tab (or change the scripts); the
# "screenshots" artifact holds the PNG files to commit.

on:
  workflow_dispatch:
  # Also when the screenshot scripts change
  push:
    paths:
      - 'docs/screenshots/**'
      - '.github/workflows/screenshots.yml'

# Waffle ModPlayer comes from the artifacts of the Build workflow
permissions:
  contents: read
  actions: read

jobs:
  linux:
    name: Linux (Xvfb, Xfwm, Caja)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and a small desktop
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libfuse3-dev fuse3 \
            xvfb x11-xserver-utils xdotool imagemagick dbus-x11 at-spi2-core \
            xfwm4 caja stalonetray python3-gi gir1.2-gtk-3.0 libnotify-bin \
            librsvg2-common adwaita-icon-theme fonts-dejavu-core \
            libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 gdb
          sudo chmod 666 /dev/fuse

      - name: Build waffle-fuse
        run: make -j"$(nproc)"

      - name: Get Waffle ModPlayer (latest successful build of this branch)
        # Not in a release yet: from the artifacts of the Build workflow
        shell: bash
        run: |
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch "$GITHUB_REF_NAME" \
                --status success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$RUN" ] && gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name waffle-modplayer-linux-x86_64 --dir "$RUNNER_TEMP/mp"; then
            echo "MODPLAYER_FOUND=1" >> "$GITHUB_ENV"
          else
            echo "::warning::no build of this branch with Waffle ModPlayer: no screenshot of it"
          fi

      - name: Take the screenshots
        run: |
          PLAYER=
          if [ -n "${MODPLAYER_FOUND:-}" ]; then
            mkdir "$RUNNER_TEMP/modplayer" && tar -C "$RUNNER_TEMP/modplayer" -xf "$RUNNER_TEMP/mp/modplayer-bundle.tar"
            PLAYER="$RUNNER_TEMP/modplayer/waffle-modplayer"
          fi
          xvfb-run -s "-screen 0 1280x800x24" dbus-run-session -- \
            bash docs/screenshots/linux.sh "$RUNNER_TEMP/shots" "$PLAYER"

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-linux
          path: ${{ runner.temp }}/shots/*.png

  macos:
    name: macOS (Finder, menu bar app)
    runs-on: macos-15
    timeout-minutes: 20
    env:
      FUSE_T_VERSION: '1.2.9'
      FUSE_T_SHA256: a1b893740ded8ea034f1acc522ded1144f4a567a1f416daef8c1441cf2662f7f
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install FUSE-T
        run: |
          PKG="$RUNNER_TEMP/fuse-t.pkg"
          curl -sSL -o "$PKG" "https://github.com/macos-fuse-t/fuse-t/releases/download/${FUSE_T_VERSION}/fuse-t-macos-installer-${FUSE_T_VERSION}.pkg"
          echo "$FUSE_T_SHA256  $PKG" | shasum -a 256 -c -
          sudo installer -pkg "$PKG" -target /

      - name: Get the app (latest release)
        run: |
          gh release download --pattern 'Waffle-DiskFlashback-*.dmg' --dir "$RUNNER_TEMP"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "$RUNNER_TEMP"/Waffle-DiskFlashback-*.dmg
          cp -R "$RUNNER_TEMP/dmg/Waffle DiskFlashback.app" "$RUNNER_TEMP/"
          hdiutil detach "$RUNNER_TEMP/dmg"

      - name: Get Waffle ModPlayer (latest successful build of this branch)
        # Not in a release yet: from the artifacts of the Build workflow
        shell: bash
        run: |
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch "$GITHUB_REF_NAME" \
                --status success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$RUN" ] && gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name waffle-fuse-packages-macos --dir "$RUNNER_TEMP/mp"; then
            echo "MODPLAYER_FOUND=1" >> "$GITHUB_ENV"
          else
            echo "::warning::no build of this branch with Waffle ModPlayer: no screenshot of it"
          fi

      - name: Take the screenshots
        run: |
          PLAYER_APP=
          if [ -n "${MODPLAYER_FOUND:-}" ]; then
            hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/mpdmg" "$RUNNER_TEMP"/mp/*.dmg
            cp -R "$RUNNER_TEMP/mpdmg/Waffle ModPlayer.app" "$RUNNER_TEMP/"
            hdiutil detach "$RUNNER_TEMP/mpdmg"
            PLAYER_APP="$RUNNER_TEMP/Waffle ModPlayer.app"
          fi
          bash docs/screenshots/macos.sh "$RUNNER_TEMP/shots" "$RUNNER_TEMP/Waffle DiskFlashback.app" "$PLAYER_APP"

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-macos
          path: ${{ runner.temp }}/shots/*.png

  windows:
    name: Windows (Explorer, tray app, installer)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      WINFSP_VERSION: '2.1'
      WINFSP_MSI: winfsp-2.1.25156.msi
      WINFSP_SHA256: 073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install WinFsp
        shell: pwsh
        run: |
          $msi = "$env:RUNNER_TEMP\$env:WINFSP_MSI"
          Invoke-WebRequest -Uri "https://github.com/winfsp/winfsp/releases/download/v$env:WINFSP_VERSION/$env:WINFSP_MSI" -OutFile $msi
          if ((Get-FileHash $msi -Algorithm SHA256).Hash -ne $env:WINFSP_SHA256) { throw "WinFsp: checksum mismatch" }
          Start-Process msiexec.exe -ArgumentList '/i', $msi, '/qn', 'INSTALLLEVEL=1000' -Wait

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc

      - name: Build waffle-fuse.exe and WaffleDiskFlashback.exe
        shell: msys2 {0}
        run: make -j"$(nproc)"

      - name: Get the installer (latest release)
        shell: pwsh
        run: gh release download --pattern 'waffle-fuse-setup-*.exe' --dir "$env:RUNNER_TEMP"

      - name: Get Waffle ModPlayer (latest successful build of this branch)
        # Not in a release yet: from the artifacts of the Build workflow
        shell: bash
        run: |
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch "$GITHUB_REF_NAME" \
                --status success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$RUN" ] && gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name waffle-fuse-packages-windows --dir "$RUNNER_TEMP/mp"; then
            echo "MODPLAYER_FOUND=1" >> "$GITHUB_ENV"
          else
            echo "::warning::no build of this branch with Waffle ModPlayer: no screenshot of it"
          fi

      - name: Take the screenshots
        # Windows PowerShell: System.Drawing for the screen captures
        shell: powershell
        run: |
          $setup = (Get-ChildItem "$env:RUNNER_TEMP\waffle-fuse-setup-*.exe").FullName
          $player = ""
          if ($env:MODPLAYER_FOUND) {
            $zip = Get-ChildItem "$env:RUNNER_TEMP\mp\waffle-fuse-*-windows-x86_64.zip" | Select-Object -First 1
            Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP\mpzip"
            $player = (Get-ChildItem -Recurse "$env:RUNNER_TEMP\mpzip" -Filter waffle-modplayer.exe | Select-Object -First 1).FullName
          }
          ./docs/screenshots/windows.ps1 -Out "$env:RUNNER_TEMP\shots" -Setup $setup -ModPlayer $player

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: ${{ runner.temp }}/shots/*.png

  collect:
    name: All screenshots
    needs: [linux, macos, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: screenshots-*
          merge-multiple: true
          path: shots
      - run: ls -l shots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*.png
