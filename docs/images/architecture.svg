<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>waffle-fuse architecture</title>
  <desc>The floppy drive talks to waffle-fuse over a USB serial port; waffle-fuse serves the AmigaDOS or FAT filesystem through FUSE (libfuse3 on Linux, FUSE-T on macOS, WinFsp on Windows) to the file manager; the tray apps start waffle-fuse and read its events.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="470" rx="12" fill="#f8fafc"/>

  <!-- Drive -->
  <rect fill="#fef3c7" stroke="#d97706" stroke-width="1.5" x="24" y="120" width="180" height="150" rx="10"/>
  <text font-size="16px" font-weight="600" fill="#111827" x="114" y="148" text-anchor="middle">Floppy drive</text>
  <text font-size="13px" fill="#374151" x="114" y="174" text-anchor="middle">DrawBridge / Waffle</text>
  <text font-size="13px" fill="#374151" x="114" y="194" text-anchor="middle">Arduino + FTDI</text>
  <text font-size="12px" fill="#4b5563" x="114" y="222" text-anchor="middle">Amiga DD/HD disks</text>
  <text font-size="12px" fill="#4b5563" x="114" y="240" text-anchor="middle">PC 720K / 1.44M disks</text>
  <text font-size="12px" fill="#4b5563" x="114" y="258" text-anchor="middle">or an .adf / .img file</text>

  <!-- waffle-fuse -->
  <rect fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" x="262" y="70" width="290" height="250" rx="10"/>
  <text font-size="16px" font-weight="600" fill="#111827" x="407" y="98" text-anchor="middle">waffle-fuse</text>
  <rect fill="#ffffff" stroke="#93c5fd" stroke-width="1" x="282" y="114" width="250" height="48" rx="6"/>
  <text font-size="13px" fill="#374151" x="407" y="134" text-anchor="middle">serial protocol, MFM decoding</text>
  <text font-size="12px" fill="#4b5563" x="407" y="152" text-anchor="middle">lib/ (from DrawBridge / DiskFlashback)</text>
  <rect fill="#ffffff" stroke="#93c5fd" stroke-width="1" x="282" y="172" width="250" height="48" rx="6"/>
  <text font-size="13px" fill="#374151" x="407" y="192" text-anchor="middle">track cache, delayed writes</text>
  <text font-size="12px" fill="#4b5563" x="407" y="210" text-anchor="middle">verify, disk removal polling</text>
  <rect fill="#ffffff" stroke="#93c5fd" stroke-width="1" x="282" y="230" width="250" height="48" rx="6"/>
  <text font-size="13px" fill="#374151" x="407" y="250" text-anchor="middle">filesystems: AmigaDOS, FAT</text>
  <text font-size="12px" fill="#4b5563" x="407" y="268" text-anchor="middle">OFS / FFS / INTL, FAT12 / FAT16 + VFAT</text>
  <text font-size="12px" fill="#4b5563" x="407" y="304" text-anchor="middle">one program on Linux, macOS, Windows</text>

  <!-- FUSE layer -->
  <rect fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" x="610" y="70" width="150" height="250" rx="10"/>
  <text font-size="16px" font-weight="600" fill="#111827" x="685" y="98" text-anchor="middle">FUSE</text>
  <text font-size="13px" fill="#374151" x="685" y="140" text-anchor="middle">Linux</text>
  <text font-size="12px" fill="#4b5563" x="685" y="158" text-anchor="middle">libfuse3, kernel</text>
  <text font-size="13px" fill="#374151" x="685" y="200" text-anchor="middle">macOS</text>
  <text font-size="12px" fill="#4b5563" x="685" y="218" text-anchor="middle">FUSE-T (NFS)</text>
  <text font-size="13px" fill="#374151" x="685" y="260" text-anchor="middle">Windows</text>
  <text font-size="12px" fill="#4b5563" x="685" y="278" text-anchor="middle">WinFsp</text>

  <!-- File manager -->
  <rect fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" x="808" y="120" width="130" height="150" rx="10"/>
  <text font-size="16px" font-weight="600" fill="#111827" x="873" y="148" text-anchor="middle">Desktop</text>
  <text font-size="13px" fill="#374151" x="873" y="180" text-anchor="middle">Caja, Nautilus</text>
  <text font-size="13px" fill="#374151" x="873" y="204" text-anchor="middle">Finder</text>
  <text font-size="13px" fill="#374151" x="873" y="228" text-anchor="middle">Explorer</text>
  <text font-size="12px" fill="#4b5563" x="873" y="254" text-anchor="middle">any program</text>

  <!-- Data flow -->
  <path stroke="#4b5563" stroke-width="1.6" fill="none" d="M204,195 L258,195" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text font-size="12px" fill="#4b5563" font-style="italic" x="231" y="186" text-anchor="middle">USB</text>
  <text font-size="12px" fill="#4b5563" font-style="italic" x="231" y="214" text-anchor="middle">serial</text>
  <path stroke="#4b5563" stroke-width="1.6" fill="none" d="M552,195 L606,195" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <path stroke="#4b5563" stroke-width="1.6" fill="none" d="M760,195 L804,195" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text font-size="12px" fill="#4b5563" font-style="italic" x="782" y="186" text-anchor="middle">files</text>

  <!-- Tray apps -->
  <rect fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5" x="262" y="370" width="498" height="76" rx="10"/>
  <text font-size="16px" font-weight="600" fill="#111827" x="511" y="396" text-anchor="middle">Tray / menu bar app</text>
  <text font-size="13px" fill="#374151" x="511" y="418" text-anchor="middle">Linux tray daemon · Waffle DiskFlashback (macOS, Windows)</text>
  <text font-size="12px" fill="#4b5563" x="511" y="436" text-anchor="middle">automount on insert, eject, copy disk ↔ image, images as virtual disks</text>
  <path stroke="#9333ea" stroke-width="1.4" fill="none" stroke-dasharray="5 4" d="M407,370 L407,324" marker-end="url(#arrow)"/>
  <text font-size="12px" fill="#4b5563" font-style="italic" x="417" y="352">starts waffle-fuse,</text>
  <text font-size="12px" fill="#4b5563" font-style="italic" x="417" y="366">reads "WAFFLE event=..." lines</text>
</svg>
