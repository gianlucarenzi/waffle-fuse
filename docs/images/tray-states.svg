<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Tray app states</title>
  <desc>States of the tray apps: looking for the drive, waiting for a disk, reading, mounted, writing changes, remove the disk; copy and write jobs run from mounted or remove.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="400" rx="12" fill="#f8fafc"/>

  <!-- Row 1 -->
  <rect fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" x="24" y="40" width="160" height="62" rx="31"/>
  <text font-size="15px" font-weight="600" fill="#111827" x="104" y="67" text-anchor="middle">no port</text>
  <text font-size="12px" fill="#4b5563" x="104" y="85" text-anchor="middle">looking for the drive</text>

  <rect fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" x="264" y="40" width="160" height="62" rx="31"/>
  <text font-size="15px" font-weight="600" fill="#111827" x="344" y="67" text-anchor="middle">waiting</text>
  <text font-size="12px" fill="#4b5563" x="344" y="85" text-anchor="middle">insert a disk</text>

  <rect fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" x="504" y="40" width="160" height="62" rx="31"/>
  <text font-size="15px" font-weight="600" fill="#111827" x="584" y="67" text-anchor="middle">mounting</text>
  <text font-size="12px" fill="#4b5563" x="584" y="85" text-anchor="middle">reading the disk</text>

  <rect fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" x="744" y="40" width="190" height="62" rx="31"/>
  <text font-size="15px" font-weight="600" fill="#111827" x="839" y="67" text-anchor="middle">mounted</text>
  <text font-size="12px" fill="#4b5563" x="839" y="85" text-anchor="middle">open in the file manager</text>

  <!-- Row 2 -->
  <rect fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" x="744" y="210" width="190" height="62" rx="31"/>
  <text font-size="15px" font-weight="600" fill="#111827" x="839" y="237" text-anchor="middle">ejecting</text>
  <text font-size="12px" fill="#4b5563" x="839" y="255" text-anchor="middle">writing the changes</text>

  <rect fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" x="440" y="210" width="190" height="62" rx="31"/>
  <text font-size="15px" font-weight="600" fill="#111827" x="535" y="237" text-anchor="middle">remove</text>
  <text font-size="12px" fill="#4b5563" x="535" y="255" text-anchor="middle">the disk can be removed</text>

  <rect fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" x="440" y="320" width="190" height="62" rx="31"/>
  <text font-size="15px" font-weight="600" fill="#111827" x="535" y="347" text-anchor="middle">busy</text>
  <text font-size="12px" fill="#4b5563" x="535" y="365" text-anchor="middle">copy disk ↔ image file</text>

  <!-- Transitions -->
  <path stroke="#4b5563" stroke-width="1.5" fill="none" d="M184,71 L260,71" marker-end="url(#a)"/>
  <text font-size="12px" fill="#374151" font-style="italic" x="222" y="62" text-anchor="middle">found</text>
  <path stroke="#4b5563" stroke-width="1.5" fill="none" d="M424,71 L500,71" marker-end="url(#a)"/>
  <text font-size="12px" fill="#374151" font-style="italic" x="462" y="62" text-anchor="middle">disk in</text>
  <path stroke="#4b5563" stroke-width="1.5" fill="none" d="M664,71 L740,71" marker-end="url(#a)"/>
  <text font-size="12px" fill="#374151" font-style="italic" x="702" y="62" text-anchor="middle">mounted</text>

  <path stroke="#4b5563" stroke-width="1.5" fill="none" d="M839,102 L839,206" marker-end="url(#a)"/>
  <text font-size="12px" fill="#374151" font-style="italic" x="849" y="160">Eject</text>
  <path stroke="#4b5563" stroke-width="1.5" fill="none" d="M744,241 L634,241" marker-end="url(#a)"/>
  <text font-size="12px" fill="#374151" font-style="italic" x="689" y="232" text-anchor="middle">written</text>
  <path stroke="#4b5563" stroke-width="1.5" fill="none" d="M440,241 L360,241 L344,106" marker-end="url(#a)"/>
  <text font-size="12px" fill="#374151" font-style="italic" x="300" y="200" text-anchor="middle">disk taken out</text>

  <!-- Disk removed while mounted -->
  <path stroke="#4b5563" stroke-width="1.5" fill="none" d="M790,40 C790,8 400,8 360,38" marker-end="url(#a)"/>
  <text font-size="12px" fill="#374151" font-style="italic" x="590" y="18" text-anchor="middle">disk taken out while mounted: unmounted automatically</text>

  <!-- Jobs -->
  <path stroke="#4b5563" stroke-width="1.5" fill="none" d="M535,272 L535,316" marker-end="url(#a)"/>
  <path stroke="#4b5563" stroke-width="1.5" fill="none" d="M780,272 C780,330 700,350 634,351" marker-end="url(#a)"/>
  <text font-size="12px" fill="#374151" font-style="italic" x="792" y="322" text-anchor="start">Copy / Write…</text>
  <path stroke="#4b5563" stroke-width="1.5" fill="none" d="M480,320 C430,320 430,290 470,276" marker-end="url(#a)"/>
  <text font-size="12px" fill="#374151" font-style="italic" x="386" y="312" text-anchor="middle">done (or remount)</text>

  <!-- Unreadable disk -->
  <path stroke="#4b5563" stroke-width="1.5" fill="none" d="M560,102 L540,206" marker-end="url(#a)"/>
  <text font-size="12px" fill="#374151" font-style="italic" x="560" y="160">unreadable</text>

  <!-- Key -->
  <rect fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" x="24" y="330" width="18" height="12" rx="6"/>
  <text font-size="12px" fill="#374151" x="48" y="341">grey icon</text>
  <rect fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" x="124" y="330" width="18" height="12" rx="6"/>
  <text font-size="12px" fill="#374151" x="148" y="341">orange icon</text>
  <rect fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" x="234" y="330" width="18" height="12" rx="6"/>
  <text font-size="12px" fill="#374151" x="258" y="341">blue icon</text>
</svg>
